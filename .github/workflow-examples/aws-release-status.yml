name: Inspect AWS release status

on:
  workflow_dispatch:

permissions:
  contents: read

# No production concurrency lock: status must remain available during deployment.
jobs:
  status:
    if: github.repository == 'seankatauskas/career-platform' && github.ref == vars.AWS_WORKFLOW_REF && github.event_name == 'workflow_dispatch' && github.actor == 'seankatauskas' && github.triggering_actor == 'seankatauskas'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      AWS_RELEASE_STATUS_DOCUMENT: ${{ vars.AWS_RELEASE_STATUS_DOCUMENT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: career-status-${{ github.run_id }}
      - name: Observe host, prepared candidate, and active workflows
        run: python3 -m job_search.release_coordinator status --output .cache/release-status.json
      - name: Preserve observed status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-status-${{ github.run_id }}
          path: .cache/release-status.json
          retention-days: 14
