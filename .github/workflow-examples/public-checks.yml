name: Public demo and offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'seankatauskas/career-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.8.4'
      - run: npm ci --prefix extension
      - run: npx --prefix extension playwright-core install --with-deps chromium
      - name: Check services, demo, browser behavior and recovery
        run: uv run --python 3.12 --with cryptography --with pypdf python scripts/check-system.py --browser --output .cache/system-checks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-validation
          path: |
            .cache/system-checks.json
            .cache/console-browser/results.json
