name: Prepare AWS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-platform-release-build
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'seankatauskas/career-platform' && github.ref == vars.AWS_WORKFLOW_REF && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'seankatauskas' && github.triggering_actor == 'seankatauskas'
    runs-on: [self-hosted, Linux, ARM64, career-platform-linux]
    environment: production
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      APP_REPOSITORY: ${{ vars.AWS_APP_REPOSITORY }}
      HERMES_REPOSITORY: ${{ vars.AWS_HERMES_REPOSITORY }}
      HERMES_BASE_IMAGE: ${{ vars.HERMES_BASE_IMAGE }}
      TECTONIC_VERSION: ${{ vars.TECTONIC_VERSION }}
      RELEASE_BUCKET: ${{ vars.AWS_RELEASE_BUCKET }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      AWS_RELEASE_STATUS_DOCUMENT: ${{ vars.AWS_RELEASE_STATUS_DOCUMENT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated production tools
        run: bash scripts/prepare-aws-runner.sh
      - name: Read production and select or reuse this exact candidate
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          unset-current-credentials: true
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: career-select-${{ github.run_id }}
      - name: Coordinate release preparation
        id: selection
        run: python3 -m job_search.release_coordinator select
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.selection.outputs.build == 'true'
        with:
          node-version: '22'
      - name: Install browser acceptance dependencies
        if: steps.selection.outputs.build == 'true'
        run: |
          npm ci --prefix extension
          npx --prefix extension playwright-core install --with-deps chromium
      - name: Validate release settings and install check dependencies
        if: steps.selection.outputs.build == 'true'
        run: |
          set -euo pipefail
          for repository in "$APP_REPOSITORY" "$HERMES_REPOSITORY"; do
            [[ "$repository" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9/_-]+$ ]]
          done
          test -n "$RELEASE_BUCKET"
          [[ "$HERMES_BASE_IMAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[a-f0-9]{64}$ ]]
          test -n "$TECTONIC_VERSION"
          python3 -m pip install -r requirements/cloud.txt -r requirements/demo.txt
      - name: Validate offline, native and Hermes release gates in parallel
        if: steps.selection.outputs.build == 'true'
        run: python3 scripts/validate-release.py
      - name: Preserve offline validation evidence
        if: always() && steps.selection.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-validation-${{ github.sha }}
          path: |
            .cache/release-transition.json
            .cache/system-checks.json
            .cache/release-validation/
            .cache/compose-acceptance/
            .cache/acceptance-toolchain/receipt.json
            extension/test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        if: steps.selection.outputs.build == 'true'
        with:
          unset-current-credentials: true
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: career-release-${{ github.run_id }}
      - name: Publish validated immutable images
        if: steps.selection.outputs.build == 'true'
        run: |
          set -euo pipefail
          for repository in "$APP_REPOSITORY" "$HERMES_REPOSITORY"; do
            aws ecr get-login-password | docker login --username AWS --password-stdin "${repository%%/*}"
          done
          docker tag career-platform:release-candidate "$APP_REPOSITORY:$RELEASE_ID"
          docker tag career-platform:reviewer-candidate "$APP_REPOSITORY:$RELEASE_ID-reviewer"
          docker run --rm "$APP_REPOSITORY:$RELEASE_ID" --help
          hermes_candidate=$(python3 scripts/validate-release-hermes.py --validated-image-id)
          docker tag "$hermes_candidate" "$HERMES_REPOSITORY:$RELEASE_ID"
          docker push "$APP_REPOSITORY:$RELEASE_ID"
          docker push "$APP_REPOSITORY:$RELEASE_ID-reviewer"
          docker push "$HERMES_REPOSITORY:$RELEASE_ID"
          app_digest=$(aws ecr describe-images --repository-name "${APP_REPOSITORY#*/}" --image-ids "imageTag=$RELEASE_ID" --query 'imageDetails[0].imageDigest' --output text)
          hermes_digest=$(aws ecr describe-images --repository-name "${HERMES_REPOSITORY#*/}" --image-ids "imageTag=$RELEASE_ID" --query 'imageDetails[0].imageDigest' --output text)
          reviewer_digest=$(aws ecr describe-images --repository-name "${APP_REPOSITORY#*/}" --image-ids "imageTag=$RELEASE_ID-reviewer" --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "REVIEWER_IMAGE=$APP_REPOSITORY@$reviewer_digest"
            echo "APP_IMAGE=$APP_REPOSITORY@$app_digest"
            echo "HERMES_IMAGE=$HERMES_REPOSITORY@$hermes_digest"
          } >> "$GITHUB_ENV"
      - name: Preserve Hermes native contract evidence
        if: always() && steps.selection.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-native-validation-${{ github.sha }}
          path: .cache/hermes-healthcheck.json
          if-no-files-found: warn
          retention-days: 14
      - name: Package committed sources and publish checksummed release
        if: steps.selection.outputs.build == 'true'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 scripts/aws-release-package.py --output "$RUNNER_TEMP/release" \
            --release-id "$RELEASE_ID" --source-sha "$GITHUB_SHA" \
            --app-image "$APP_IMAGE" --hermes-image "$HERMES_IMAGE" --reviewer-image "$REVIEWER_IMAGE" \
            --hermes-base-image "$HERMES_BASE_IMAGE" --tectonic-version "$TECTONIC_VERSION" \
            --transition-evidence .cache/release-transition.json
          for name in release.tar.gz manifest.json; do
            aws s3api put-object --bucket "$RELEASE_BUCKET" --key "releases/$RELEASE_ID/$name" \
              --body "$RUNNER_TEMP/release/$name" --if-none-match '*' > /dev/null
          done
          manifest_sha=$(sha256sum "$RUNNER_TEMP/release/manifest.json" | cut -d ' ' -f 1)
          echo "MANIFEST_SHA=$manifest_sha" >> "$GITHUB_ENV"
      - name: Record the prepared release without installing it
        if: steps.selection.outputs.build == 'true'
        run: |
          python3 scripts/prepared-release.py verify --release-id "$RELEASE_ID" --sha256 "$MANIFEST_SHA" \
            --manifest "$RUNNER_TEMP/release/manifest.json" --output .cache/prepared-release.json
      - name: Publish candidate for reuse after rechecking production
        if: steps.selection.outputs.build == 'true'
        run: python3 -m job_search.release_coordinator publish
      - name: Preserve prepared release receipt
        if: success() && env.RELEASE_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-release-${{ env.RELEASE_ID }}
          path: |
            .cache/prepared-release.json
            .cache/hermes-healthcheck.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove this job's tools and registry credentials
        if: always() && env.CAREER_RUNNER_ROOT != ''
        run: rm -rf -- "${CAREER_RUNNER_ROOT:?}"
