name: AWS infrastructure checks

on:
  pull_request:
  push:
    branches: [main, codex/aws-infrastructure, codex/system-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    if: github.repository == 'seankatauskas/career-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser acceptance dependencies
        run: |
          npm ci --prefix extension
          npx --prefix extension playwright-core install --with-deps chromium
      - name: Offline security, deployment, and application checks
        run: |
          set -euo pipefail
          python -m pip install -r requirements/cloud.txt -r requirements/demo.txt
          python scripts/check-system.py --browser --output .cache/system-checks.json
      - name: Build and validate production Compose without credentials
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag career-platform:ci .
          docker run --rm career-platform:ci --help
          python scripts/prepare-acceptance-toolchain.py --output .cache/acceptance-toolchain
          python scripts/compose-acceptance.py --image career-platform:ci --toolchain-dir .cache/acceptance-toolchain --output .cache/compose-acceptance --require-linux-host
          python scripts/release-transition-acceptance.py --candidate-image career-platform:ci
      - name: Preserve offline validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-validation-${{ github.sha }}
          path: |
            .cache/release-transition.json
            .cache/system-checks.json
            .cache/compose-acceptance/
            .cache/acceptance-toolchain/receipt.json
            extension/test-results/
          if-no-files-found: warn
          retention-days: 14
  terraform:
    if: github.repository == 'seankatauskas/career-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra/aws
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
      - run: terraform -chdir=infra/aws test
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/aws/bootstrap validate
      - run: terraform -chdir=infra/aws/recovery-drill init -backend=false -input=false
      - run: terraform -chdir=infra/aws/recovery-drill validate
      - run: terraform -chdir=infra/aws/recovery-drill test
      - run: python3 infra/aws/tests/test_bootstrap.py
