name: AWS infrastructure checks

on:
  pull_request:
  push:
    branches: [main, codex/aws-infrastructure, codex/system-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    if: >-
      github.repository == 'seankatauskas/career-platform' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, career-platform-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated Python on the Linux guest
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/acceptance-venv"
          echo "$RUNNER_TEMP/acceptance-venv/bin" >> "$GITHUB_PATH"
          docker info
          docker compose version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser acceptance dependencies
        run: |
          npm ci --prefix extension
          npx --prefix extension playwright-core install --with-deps chromium
      # Application/browser suites run once in public-checks.yml (on the Mac).
      - name: Install production acceptance dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements/cloud.txt -r requirements/demo.txt
      - name: Build and validate production Compose without credentials
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag career-platform:ci .
          docker run --rm career-platform:ci --help
          docker build --platform linux/amd64 --file Dockerfile.codex-review --tag career-platform:reviewer-ci .
          reviewer_id=$(docker image inspect career-platform:reviewer-ci --format '{{.Id}}')
          python -m tests.probe_codex_review_container --image "$reviewer_id"
          python -m tests.probe_codex_review_container --image "$reviewer_id" --screening
          python -m tests.probe_codex_review_container --image "$reviewer_id" --adjudicator
          # A persistent runner must not retain root-owned Python caches.
          sudo "$(command -v python)" -B -m tests.probe_old_method_container --image "$reviewer_id" --require-host-runtime
          python scripts/prepare-acceptance-toolchain.py --output .cache/acceptance-toolchain
          python scripts/compose-acceptance.py --image career-platform:ci --toolchain-dir .cache/acceptance-toolchain --output .cache/compose-acceptance --require-linux-host
          python scripts/release-transition-acceptance.py --candidate-image career-platform:ci
      - name: Preserve offline validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-validation-${{ github.sha }}
          path: |
            .cache/release-transition.json
            .cache/compose-acceptance/
            .cache/acceptance-toolchain/receipt.json
            extension/test-results/
          if-no-files-found: warn
          retention-days: 14
  terraform:
    if: >-
      github.repository == 'seankatauskas/career-platform' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, career-platform]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra/aws
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
      - run: terraform -chdir=infra/aws test
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/aws/bootstrap validate
      - run: terraform -chdir=infra/aws/recovery-drill init -backend=false -input=false
      - run: terraform -chdir=infra/aws/recovery-drill validate
      - run: terraform -chdir=infra/aws/recovery-drill test
      - run: python3 infra/aws/tests/test_bootstrap.py
