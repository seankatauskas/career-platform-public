name: Public demo and offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'seankatauskas/career-platform' || github.repository == 'seankatauskas/career-platform-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.8.4'
      - run: npm ci --prefix extension
      - run: npx --prefix extension playwright-core install --with-deps chromium
      - name: Check services, demo, browser behavior and recovery
        run: uv run --python 3.12 --with cryptography --with pypdf --with reportlab python scripts/check-system.py --browser --output .cache/system-checks.json
      - name: Export the source that the daily publisher will validate
        if: github.repository == 'seankatauskas/career-platform'
        run: python3 scripts/prepare-public-showcase.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/public-export"
      - name: Check the public export before publication
        if: github.repository == 'seankatauskas/career-platform'
        working-directory: ${{ runner.temp }}/public-export
        run: |
          set -euo pipefail
          git init --initial-branch=main
          git add --force --all
          git -c user.name=validation -c user.email=validation@example.test commit --quiet -m 'Validate exported source'
          npm ci --prefix extension
          uv run --python 3.12 --with cryptography --with pypdf --with reportlab python scripts/check-system.py --browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-validation
          path: |
            .cache/system-checks.json
            .cache/console-browser/results.json
            ${{ runner.temp }}/public-export/.cache/system-checks.json
