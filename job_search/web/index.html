<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Career Platform</title>
  <script src="/assets/console.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/applications-view.css">
  <link rel="stylesheet" href="/assets/shortlist-view.css">
  <link rel="stylesheet" href="/assets/review-view.css">
  <link rel="stylesheet" href="/assets/settings-view.css">
  <script src="/assets/job-preview.js" defer></script>
  <script src="/assets/applications-view.js" defer></script>
  <script src="/assets/shortlist-view.js" defer></script>
  <script src="/assets/review-view.js" defer></script>
  <script src="/assets/settings-view.js" defer></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header class="masthead">
    <a class="brand" href="#applications">Career Platform</a>
    <div class="header-status">
      <span id="demo-badge" hidden>Demo · fictional data</span>
      <details id="header-notifications">
        <summary aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span id="notification-dot" hidden aria-hidden="true"></span>
        </summary>
        <div class="notification-panel" role="region" aria-label="Notifications">
          <strong>Notifications</strong>
          <p id="notification-status">Checking system status…</p>
          <a id="header-health" href="#settings/operations">View system status</a>
        </div>
      </details>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode">
        <svg class="theme-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2a9 9 0 1 0 9.9 9.9Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <nav class="sidebar" aria-label="Dashboard views">
    <p class="nav-label">Workspace</p>
    <a href="#applications">Applications</a>
    <a href="#shortlist">Shortlist</a>
    <a href="#review">Review<span id="review-count" class="nav-count"></span></a>
    <p class="nav-label nav-secondary">System</p>
    <a href="#settings">Settings</a>
    <p class="sidebar-note">Personal workspace</p>
  </nav>

  <main id="main" tabindex="-1">
    <p id="notice" class="notice" role="status" hidden></p>

    <section id="shortlist" class="panel hero-panel" hidden>
    </section>

    <section id="career" class="panel career-panel" hidden>
    </section>

<section id="applications" class="panel">
    </section>

    <section id="attention" class="panel accent-panel" hidden>
    </section>

<section id="outlook-actions" class="panel">
    </section>

    <section id="ops" class="panel" hidden>
    </section>

    <section id="settings" class="panel" hidden>
    </section>
  </main>

  <dialog id="job-preview" aria-labelledby="job-preview-title">
    <header class="job-preview-header">
      <div><p class="kicker">Job preview</p><p id="job-preview-company"></p><h2 id="job-preview-title"></h2></div>
      <button id="job-preview-close" type="button" class="quiet" autofocus aria-label="Close job preview">Close</button>
    </header>
    <div id="job-preview-body" aria-live="polite"></div>
  </dialog>
  <footer>Private workspace · Application submission and sending remain yours.</footer>
</body>
</html>
